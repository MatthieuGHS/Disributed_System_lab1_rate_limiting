\* Safety ALONE is not inductive: TLC must find a state satisfying it
\* (an unreachable one) whose successor violates it: a counterexample
\* to induction (CTI). Compare with RateLimiterInductive.cfg.
CONSTANTS
    Workers = {w1, w2}
    IPs = {a}
    L = 1
    MaxWindow = 1
    MaxReq = 1
    Policy = "fail_closed"

INIT SafetyAlone
NEXT Next
INVARIANT SafetyAlone
CHECK_DEADLOCK FALSE
