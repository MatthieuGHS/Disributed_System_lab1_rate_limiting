\* Inductiveness of IndInv: start from EVERY state satisfying IndInv
\* (not only reachable ones) and check that one step keeps it.
\* If IndInv /\ Next => IndInv' then Safety holds forever (and
\* Init => IndInv is checked by RateLimiter.cfg).
\* Small constants: TLC enumerates all of TypeOK.
CONSTANTS
    Workers = {w1, w2}
    IPs = {a}
    L = 1
    MaxWindow = 1
    MaxReq = 1
    Policy = "fail_closed"

INIT IndInv
NEXT Next
INVARIANT IndInv
CHECK_DEADLOCK FALSE
